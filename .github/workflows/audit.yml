name: Audit suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline probes (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency only
        run: python -m pip install --upgrade "pytest>=8"
      - name: Selfcheck (no cognee, no network, no key)
        run: python -m selfcheck
      - name: README example smoke check
        run: python -m selfcheck_readme
      - name: Pytest
        run: python -m pytest -q
      - name: Skill gate matrix against the pinned reference copy
        run: python tools/audit_skill_gate.py --reference

  package:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install --upgrade build twine
      - name: Build distribution
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
